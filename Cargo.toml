[package]
name = "bake-markdown"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/socketry/bake-markdown-rust"
description = "Markdown normalization tasks for Bake"
readme = "readme.md"
include = ["src/**", "tests/**", "context/**", "Cargo.toml", "readme.md", "license.md", "releases.md"]

[workspace]
members = ["bake"]
resolver = "3"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[workspace.metadata.bake.release]
reviewers = ["socketry/managers"]

[dependencies]
bake = ">=0.19.0"
socketry-markdown = "0.3.0"

[dev-dependencies]
tempfile = "3.27"
